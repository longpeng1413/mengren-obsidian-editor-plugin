name: Release
on:
  push:
    tags: ['[0-9]*']
  # Release from the Actions page when a tag cannot be pushed: the workflow
  # creates the tag on the current main commit.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, same as manifest.json (e.g. 0.1.17)'
        required: true
permissions:
  contents: write
  # Signed build provenance for the files Obsidian downloads.
  id-token: write
  attestations: write
jobs:
  release:
    # Pinned to the same image as CI (ubuntu-latest moved to Ubuntu 26 in Oct 2026).
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate version
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: node scripts/validate-release.cjs "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:core
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        # Only the files Obsidian downloads; versions.json is read from the repository.
        # A tag push releases that tag; a manual run creates the tag on this commit
        # and refuses a version whose tag already exists.
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then echo "Tag $RELEASE_TAG already exists"; exit 1; fi
            where=(--target "$GITHUB_SHA")
          else
            where=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" manifest.json main.js styles.css "${where[@]}" --title "Mengren Editor $RELEASE_TAG" --notes-file CHANGELOG.md
