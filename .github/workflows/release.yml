name: Release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: write
  # Signed build provenance for the files Obsidian downloads.
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate version
        run: node scripts/validate-release.cjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:core
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # Only the files Obsidian downloads; versions.json is read from the repository.
        run: gh release create "$RELEASE_TAG" manifest.json main.js styles.css --verify-tag --title "Mengren Editor $RELEASE_TAG" --notes-file CHANGELOG.md
