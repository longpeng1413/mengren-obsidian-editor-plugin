name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Pinned: Playwright does not support the ubuntu-latest image (Ubuntu 26) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code -- main.js
      - run: pnpm exec playwright install --with-deps chromium
      - name: All regressions
        run: |
          export TET_BROWSER="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          pnpm test
